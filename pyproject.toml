[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsearch-agent"
version = "0.1.0"
description = "Job search, CV generation, and cover-letter automation toolkit with a FastAPI server and CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    # FastAPI server
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.12.5",
    # LLM / agent framework.
    # google-adk 2.x is required: the 1.x line caps fastapi at <0.124 and conflicts
    # with the server's fastapi pin. [extensions] pulls the LiteLlm wrapper the agents
    # import (google.adk.models.lite_llm).
    "google-adk[extensions]>=2.0.0",
    "litellm>=1.40.0",
    # Only langchain_community.tools is imported; it pulls langchain + langchain-core.
    # Pinned to the 0.3.x line that the app is verified against (the 1.x line moved
    # TavilySearchResults and other integrations).
    "langchain-community>=0.3.0,<0.4",
    "tavily-python>=0.3.0",
    # Web scraping
    "playwright>=1.57.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    # Document handling
    "python-docx>=0.8.11",
    "pypdf>=6.10.2",
    "markdown-pdf>=1.3.0",
    # Config + utilities
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "websockets>=11.0",   # client for jobsearch-api --test
]
notebooks = [
    "ipykernel>=7.1.0",
    "ipython>=9.8.0",
]

[project.scripts]
jobsearch-agent = "jobsearch_agent.cli:main"
jobsearch-api = "jobsearch_agent.api.server:main"

[tool.setuptools.packages.find]
include = ["jobsearch_agent*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
jobsearch_agent = [
    "api/ui/*.html",
    "api/ui/*.css",
    "api/ui/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
